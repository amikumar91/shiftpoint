[project]
name = "shiftpoint"
version = "0.0.0"
description = "Detect when an agent session's scope locks, and emit a signal routers can act on."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12"
dependencies = ["shiftpoint-core"]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["packages/*"]

[tool.uv.sources]
shiftpoint-core = { workspace = true }

[dependency-groups]
dev = [
    "pyright>=1.1.390",
    "pytest>=8.3",
    "ruff>=0.8",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]

[tool.pyright]
pythonVersion = "3.12"
include = ["packages"]
strict = ["packages/core/src"]
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
testpaths = ["packages/core/tests"]
addopts = ["-ra", "--strict-markers", "--import-mode=importlib"]
